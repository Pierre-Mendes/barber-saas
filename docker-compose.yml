services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # Caixa de e-mail de desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/barber?schema=public
      SMTP_URL: smtp://mailpit:1025
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Dispara os lembretes a cada 5 minutos.
  cron:
    image: curlimages/curl:latest
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders; echo; sleep 300; done'
    depends_on:
      - app

  # Dados de demonstração: docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/barber?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
